name: Repair repository layout

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact tracked tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode repository.tar.gz.b64 > /tmp/repository.tar.gz
          git ls-files -z | xargs -0 rm -f
          tar -xzf /tmp/repository.tar.gz
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: restore economic data collector layout"
          git push
