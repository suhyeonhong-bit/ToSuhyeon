name: Repair repository layout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore code and data layout
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode repository.tar.gz.b64 > /tmp/repository.tar.gz
          mkdir -p /tmp/repository
          tar -xzf /tmp/repository.tar.gz -C /tmp/repository
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .github/*) ;;
              *) rm -f -- "$file" ;;
            esac
          done
          rsync -a --exclude '.github/' /tmp/repository/ ./
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: restore economic data collector layout"
          git push
