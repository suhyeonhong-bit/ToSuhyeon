name: Collect monthly economic data

on:
  schedule:
    - cron: "30 0 1 * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-economic-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Collect ECOS and FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python3 collect_data.py

      - name: Commit generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/raw data/processed/monthly_indicators.csv
          if git diff --cached --quiet; then
            echo "No generated data changed."
            exit 0
          fi
          git commit -m "data: collect monthly indicators $(date -u +'%Y-%m-%d')"
          git push origin HEAD:main
